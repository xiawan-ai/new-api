<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Use the deployment title until cached or fetched system branding is applied. -->
    <title>Finch Token</title>
    <meta name="title" content="" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#f4f1e8" />
    <!-- Apply the theme class before first paint so one-shot detectors
         (e.g. Dark Reader) see the real theme. The mode is locked to light:
         the Finch house style is a single cream paper theme, so neither the
         saved nor the system preference is consulted.
         Keep in sync with LOCKED_THEME_MODE and ThemeProvider. -->
    <script>
      ;(function () {
        document.documentElement.classList.add('light')
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
